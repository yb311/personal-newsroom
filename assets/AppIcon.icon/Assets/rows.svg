  <!-- The rest of the list: everything you did not ask to be told about.
       Full-bleed 1024 canvas, no background, no baked-in shadow - on macOS 26
       the system draws the icon shape, the shadow and the specular highlight.
       Its own layer, so an appearance override can fade it on its own and the
       hierarchy survives Dark, Tinted and Clear. See dev/make-icon.mjs. -->
