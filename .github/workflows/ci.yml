name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.0
          cache-dependency-path: native/reader/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run offline test suite
        run: npm run test:ci

      - name: Verify unsigned packaging
        run: npm run package:dir
